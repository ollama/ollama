name: test

concurrency:
  # For PRs, later CI runs preempt previous ones. e.g. a force push on a PR
  # cancels running CI jobs and starts all new ones.
  #
  # For non-PR pushes, concurrency.group needs to be unique for every distinct
  # CI run we want to have happen. Use run_id, which in practice means all
  # non-PR CI runs will be allowed to run without preempting each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '**/*'
      - '!docs/**'
      - '!README.md'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      app_changed: ${{ steps.changes.outputs.app_changed }}
      enginehash: ${{ steps.changes.outputs.enginehash }}
      stable_tag: ${{ steps.stable.outputs.tag }}
      stable_darwin_url: ${{ steps.stable.outputs.darwin_url }}
      stable_darwin_sha256: ${{ steps.stable.outputs.darwin_sha256 }}
      stable_windows_amd64_url: ${{ steps.stable.outputs.windows_amd64_url }}
      stable_windows_amd64_sha256: ${{ steps.stable.outputs.windows_amd64_sha256 }}
      stable_windows_arm64_url: ${{ steps.stable.outputs.windows_arm64_url }}
      stable_windows_arm64_sha256: ${{ steps.stable.outputs.windows_arm64_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - id: changes
        run: |
          changed() {
            local BASE=${{ github.event.pull_request.base.sha }}
            local HEAD=${{ github.event.pull_request.head.sha }}
            local MERGE_BASE=$(git merge-base $BASE $HEAD)
            git diff-tree -r --no-commit-id --name-only "$MERGE_BASE" "$HEAD" \
              | xargs python3 -c "import sys; from pathlib import Path; print(any(Path(x).match(glob) for x in sys.argv[1:] for glob in '$*'.split(' ')))"
          }

          echo changed=$(changed \
            'CMakeLists.txt' \
            'CMakePresets.json' \
            'cmake/**' \
            'cmake/**/*' \
            'llama/server/**/*' \
            'llama/compat/**/*' \
            'LLAMA_CPP_VERSION' \
            'MLX_VERSION' \
            'MLX_C_VERSION' \
            'llama/llama.cpp/**/*' \
            'ml/backend/ggml/ggml/**/*' \
            'x/imagegen/mlx/**' \
            'x/imagegen/mlx/**/*' \
            'x/mlxrunner/xgrammar/native/**' \
            'x/mlxrunner/xgrammar/native/**/*' \
            '.github/**/*') | tee -a $GITHUB_OUTPUT
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          MERGE_BASE=$(git merge-base $BASE $HEAD)
          CHANGED_FILES=$(git diff-tree -r --no-commit-id --name-only "$MERGE_BASE" "$HEAD")

          app_changed() {
            local path root
            while IFS= read -r path; do
              case "$path" in
                app/*|go.mod|go.sum|scripts/build_darwin.sh|scripts/build_windows.ps1|.github/workflows/test.yaml)
                  echo True
                  return
                  ;;
              esac
              for root in "${@:2}"; do
                if [[ "$path" == "$root" || "$path" == "$root/"* ]]; then
                  echo True
                  return
                fi
              done
            done <<< "$1"
            echo False
          }

          APP_ROOTS=()
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            PACKAGE_DIRS=$(GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=1 \
              go list -e -deps -f '{{if not .Standard}}{{.Dir}}{{end}}' ./app/cmd/app)
            while IFS= read -r dir; do
              case "$dir" in "$PWD"/*) APP_ROOTS+=("${dir#"$PWD"/}") ;; esac
            done <<< "$PACKAGE_DIRS"
          done

          test "$(app_changed api/client.go "${APP_ROOTS[@]}")" = True
          test "$(app_changed docs/development.md "${APP_ROOTS[@]}")" = False
          echo app_changed=$(app_changed "$CHANGED_FILES" "${APP_ROOTS[@]}") | tee -a $GITHUB_OUTPUT
          echo enginehash=$(cat LLAMA_CPP_VERSION)-$(cat MLX_VERSION)-$(cat MLX_C_VERSION) | tee -a $GITHUB_OUTPUT
      - name: Resolve latest stable release
        if: steps.changes.outputs.app_changed == 'True'
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(mktemp)"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$release" https://api.github.com/repos/ollama/ollama/releases/latest

          tag="$(jq -er .tag_name "$release")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          asset() {
            local name=$1
            local output=$2
            local url digest
            url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$release")"
            digest="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest' "$release")"
            case "$digest" in sha256:*) ;; *) exit 1 ;; esac
            echo "${output}_url=$url" >> "$GITHUB_OUTPUT"
            echo "${output}_sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          }

          asset ollama-darwin.tgz darwin
          asset ollama-windows-amd64.zip windows_amd64
          asset ollama-windows-arm64.zip windows_arm64

  app-darwin:
    needs: [changes]
    if: needs.changes.outputs.app_changed == 'True'
    runs-on: macos-latest
    env:
      VERSION: 0.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: .cache/app-ci/ollama-darwin.tgz
          key: app-ci-darwin-${{ needs.changes.outputs.stable_tag }}-${{ needs.changes.outputs.stable_darwin_sha256 }}
      - name: Prepare stable Darwin runtime payload
        shell: bash
        run: |
          set -euo pipefail
          archive=.cache/app-ci/ollama-darwin.tgz
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$archive" "${{ needs.changes.outputs.stable_darwin_url }}"
          fi
          echo "${{ needs.changes.outputs.stable_darwin_sha256 }}  $archive" | shasum -a 256 -c -

          payload="$RUNNER_TEMP/ollama-darwin-stable"
          rm -rf "$payload" dist/darwin
          mkdir -p "$payload" dist/darwin/lib/ollama
          tar -xzf "$archive" -C "$payload"
          mv "$payload/ollama" "$payload/llama-server" "$payload/llama-quantize" dist/darwin/
          for item in "$payload"/*; do
            mv "$item" dist/darwin/lib/ollama/
          done
      - name: Build macOS app
        run: ./scripts/build_darwin.sh app
      - name: Verify macOS app outputs
        shell: bash
        run: |
          app=dist/Ollama.app/Contents/MacOS/Ollama
          ollama=dist/Ollama.app/Contents/Resources/ollama
          test -x "$app"
          test -x "$ollama"
          test -f dist/Ollama-darwin.zip
          lipo "$app" -verify_arch x86_64 arm64
          lipo "$ollama" -verify_arch x86_64 arm64

          expected="${{ needs.changes.outputs.stable_tag }}"
          actual="$($ollama --version 2>&1)"
          echo "$actual"
          echo "$actual" | grep -Fqw "${expected#v}"

  app-windows:
    needs: [changes]
    if: needs.changes.outputs.app_changed == 'True'
    runs-on: windows
    env:
      VERSION: 0.0.0
    steps:
      - name: Install clang and gcc-compat
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip" -OutFile "${{ runner.temp }}\llvm-mingw-ucrt.zip"
          Expand-Archive -Path "${{ runner.temp }}\llvm-mingw-ucrt.zip" -DestinationPath "C:\Program Files\"
          $installPath = (Resolve-Path -Path "C:\Program Files\llvm-mingw-*-ucrt-x86_64").Path
          "$installPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: .cache/app-ci/ollama-windows-*.zip
          key: app-ci-windows-${{ needs.changes.outputs.stable_tag }}-${{ needs.changes.outputs.stable_windows_amd64_sha256 }}-${{ needs.changes.outputs.stable_windows_arm64_sha256 }}
      - name: Prepare stable Windows runtime payload
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force -Path .cache\app-ci | Out-Null
          $assets = @(
            @("amd64", "${{ needs.changes.outputs.stable_windows_amd64_url }}", "${{ needs.changes.outputs.stable_windows_amd64_sha256 }}"),
            @("arm64", "${{ needs.changes.outputs.stable_windows_arm64_url }}", "${{ needs.changes.outputs.stable_windows_arm64_sha256 }}")
          )
          foreach ($asset in $assets) {
            $arch, $url, $sha256 = $asset
            $archive = ".cache\app-ci\ollama-windows-$arch.zip"
            if (-not (Test-Path $archive)) {
              Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 2
            }
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha256) {
              throw "SHA256 mismatch for $archive"
            }
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "dist\windows-$arch"
            Expand-Archive -Path $archive -DestinationPath "dist\windows-$arch"
          }
          Remove-Item -Force -ErrorAction SilentlyContinue "dist\windows-*\ollama app.exe", "dist\windows-ollama-app-*.exe"
      - name: Build Windows apps and installer
        run: ./scripts/build_windows.ps1 app appArm64 installer
      - name: Verify Windows app payloads
        run: |
          if (-not (Test-Path dist\windows-ollama-app-amd64.exe)) { throw "missing amd64 app" }
          if (-not (Test-Path dist\windows-ollama-app-arm64.exe)) { throw "missing arm64 app" }
          if (-not (Test-Path dist\OllamaSetup.exe)) { throw "missing installer" }

          function Assert-PEMachine($path, $expected) {
            $stream = [IO.File]::OpenRead((Resolve-Path $path))
            $reader = [IO.BinaryReader]::new($stream)
            try {
              $stream.Position = 0x3c
              $stream.Position = $reader.ReadInt32() + 4
              $actual = $reader.ReadUInt16()
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
            if ($actual -ne $expected) {
              throw "unexpected PE machine type 0x$($actual.ToString('x4')) for $path"
            }
          }

          Assert-PEMachine dist\windows-amd64\ollama.exe 0x8664
          Assert-PEMachine dist\windows-arm64\ollama.exe 0xaa64
          Assert-PEMachine dist\windows-ollama-app-amd64.exe 0x8664
          Assert-PEMachine dist\windows-ollama-app-arm64.exe 0xaa64
      - name: Smoke-test Windows installer
        env:
          APP_CI_INSTALL_DIR: ${{ runner.temp }}\ollama-app-ci
        run: |
          $arguments = @(
            "/VERYSILENT",
            "/NORESTART",
            "/SUPPRESSMSGBOXES",
            "/DIR=$env:APP_CI_INSTALL_DIR"
          )
          $installer = Start-Process -FilePath .\dist\OllamaSetup.exe -ArgumentList $arguments -PassThru
          $installer.WaitForExit()
          if ($installer.ExitCode -ne 0) { throw "installer failed with exit code $($installer.ExitCode)" }

          $ollama = Join-Path $env:APP_CI_INSTALL_DIR "ollama.exe"
          $app = Join-Path $env:APP_CI_INSTALL_DIR "ollama app.exe"
          if (-not (Test-Path $ollama)) { throw "installer did not install ollama.exe" }
          if (-not (Test-Path $app)) { throw "installer did not install ollama app.exe" }

          $expected = "${{ needs.changes.outputs.stable_tag }}".TrimStart("v")
          $actual = (& $ollama --version 2>&1 | Out-String).Trim()
          $ollamaExitCode = $LASTEXITCODE
          Write-Output $actual
          if ($ollamaExitCode -ne 0) { throw "installed CLI exited with code $ollamaExitCode" }
          if ($actual -notmatch "(^|\s)$([regex]::Escape($expected))(\s|$)") {
            throw "installed CLI does not report expected version $expected"
          }

          $appVersion = (& $app --version 2>&1 | Out-String).Trim()
          $appExitCode = $LASTEXITCODE
          Write-Output "Ollama app version: $appVersion"
          if ($appExitCode -ne 0) { throw "installed app exited with code $appExitCode" }
      - name: Remove Windows smoke-test installation
        if: always()
        env:
          APP_CI_INSTALL_DIR: ${{ runner.temp }}\ollama-app-ci
        run: |
          $uninstaller = Join-Path $env:APP_CI_INSTALL_DIR "unins000.exe"
          if (Test-Path $uninstaller) {
            $arguments = @("/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES")
            $process = Start-Process -FilePath $uninstaller -ArgumentList $arguments -PassThru
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "uninstaller failed with exit code $($process.ExitCode)" }
          }

  patches:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify patches apply cleanly
        shell: bash
        run: |
          cmake -S llama/server -B "$RUNNER_TEMP/llama-server-patch-check" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DOLLAMA_RUNNER_DIR=

  linux:
    needs: [changes]
    if: needs.changes.outputs.changed == 'True'
    strategy:
      matrix:
        include:
          - preset: CPU
            superbuild_target: ollama-local
            superbuild_dir: build/local-superbuild
            superbuild_args: ''
            expected_payload: lib/ollama/llama-server
            install-go: true
          - preset: CUDA
            container: nvidia/cuda:13.0.0-devel-ubuntu22.04
            superbuild_target: ollama-llama-server-cuda_v13
            superbuild_dir: build/local-superbuild-cuda_v13
            superbuild_args: '-DOLLAMA_LLAMA_BACKENDS=cuda_v13 -DCMAKE_CUDA_ARCHITECTURES=87'
            expected_payload: lib/ollama/cuda_v13/libggml-cuda.so
          - preset: ROCm
            container: rocm/dev-ubuntu-22.04:7.2.1
            extra-packages: rocm-libs
            superbuild_target: ollama-llama-server-rocm_v7_2
            superbuild_dir: build/local-superbuild-rocm_v7_2
            superbuild_args: '-DOLLAMA_LLAMA_BACKENDS=rocm_v7_2 -DAMDGPU_TARGETS=gfx1010 -DCMAKE_PREFIX_PATH=/opt/rocm'
            expected_payload: lib/ollama/rocm_v7_2/libggml-hip.so
          - preset: Vulkan
            container: ubuntu:22.04
            extra-packages: >
              mesa-vulkan-drivers vulkan-tools
              libvulkan1 libvulkan-dev
              vulkan-sdk spirv-headers cmake ccache g++ make
            superbuild_target: ollama-llama-server-vulkan
            superbuild_dir: build/local-superbuild-vulkan
            superbuild_args: '-DOLLAMA_LLAMA_BACKENDS=vulkan'
            expected_payload: lib/ollama/vulkan/libggml-vulkan.so
          - preset: 'MLX CUDA 13'
            container: nvidia/cuda:13.0.0-devel-ubuntu22.04
            extra-packages: libcudnn9-dev-cuda-13 libopenblas-dev liblapack-dev liblapacke-dev git curl
            superbuild_target: ollama-mlx-cuda_v13
            superbuild_dir: build/local-superbuild-mlx-cuda_v13
            superbuild_args: '-DOLLAMA_MLX_BACKENDS=cuda_v13 -DCMAKE_CUDA_ARCHITECTURES=87 -DMLX_CUDA_ARCHITECTURES=80-virtual -DBLAS_INCLUDE_DIRS=/usr/include/x86_64-linux-gnu -DLAPACK_INCLUDE_DIRS=/usr/include/x86_64-linux-gnu'
            expected_payload: lib/ollama/mlx_cuda_v13/libmlx.so lib/ollama/mlx_cuda_v13/libollama_xgrammar.so
            install-go: true
    runs-on: linux
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -n "${{ matrix.container }}" ] || sudo=sudo
          $sudo apt-get update
          # Add LunarG Vulkan SDK apt repo for Ubuntu 22.04
          if [ "${{ matrix.preset }}" = "Vulkan" ]; then
            $sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates software-properties-common
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | $sudo gpg --dearmor -o /usr/share/keyrings/lunarg-archive-keyring.gpg
            # Use signed-by to bind the repo to the installed keyring to avoid NO_PUBKEY
            echo "deb [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg]  https://packages.lunarg.com/vulkan/1.4.313 jammy main" | $sudo tee /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list > /dev/null
            $sudo apt-get update
          fi
          $sudo apt-get install -y cmake ccache curl git ${{ matrix.extra-packages }}
          # Use a current CMake for upstream llama.cpp and Vulkan dependency discovery.
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.2/cmake-3.31.2-linux-$(uname -m).tar.gz | $sudo tar xz -C /usr/local --strip-components 1
          # Export VULKAN_SDK if provided by LunarG package (defensive)
          if [ -d "/usr/lib/x86_64-linux-gnu/vulkan" ] && [ "${{ matrix.preset }}" = "Vulkan" ]; then
            echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          fi
        env:
          DEBIAN_FRONTEND: noninteractive
      - if: matrix.install-go
        name: Install Go
        run: |
          [ -n "${{ matrix.container }}" ] || sudo=sudo
          GO_VERSION=$(awk '/^go / { print $2 }' go.mod)
          curl -fsSL "https://golang.org/dl/go${GO_VERSION}.linux-$(dpkg --print-architecture).tar.gz" | $sudo tar xz -C /usr/local
          echo "/usr/local/go/bin" >> $GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ needs.changes.outputs.enginehash }}
      - name: Build native superbuild
        if: matrix.superbuild_target
        run: |
          cmake -S . -B "${{ matrix.superbuild_dir }}" ${{ matrix.superbuild_args }}
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cmake --build "${{ matrix.superbuild_dir }}" --target "${{ matrix.superbuild_target }}" -- -l $(nproc)
          for f in ${{ matrix.expected_payload }}; do
            test -e "${{ matrix.superbuild_dir }}/$f"
          done
      - name: Verify local superbuild install
        if: matrix.superbuild_target == 'ollama-local'
        run: |
          ./ollama --version
          "${{ matrix.superbuild_dir }}/lib/ollama/llama-server" --version
          test -x "${{ matrix.superbuild_dir }}/lib/ollama/llama-quantize"
          cmake --install "${{ matrix.superbuild_dir }}" --component ollama-local --prefix "$RUNNER_TEMP/ollama-local"
          "$RUNNER_TEMP/ollama-local/bin/ollama" --version
          "$RUNNER_TEMP/ollama-local/lib/ollama/llama-server" --version
          test -x "$RUNNER_TEMP/ollama-local/lib/ollama/llama-quantize"
  windows:
    needs: [changes]
    if: needs.changes.outputs.changed == 'True'
    strategy:
      matrix:
        include:
          - preset: CPU
            superbuild_target: ollama-local
            superbuild_dir: build\local-superbuild
            superbuild_args: ''
            expected_payload: lib\ollama\llama-server.exe
          - preset: CUDA
            install: https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_windows.exe
            superbuild_target: ollama-llama-server-cuda_v13
            superbuild_dir: build\local-superbuild-cuda_v13
            superbuild_args: '-DOLLAMA_LLAMA_BACKENDS=cuda_v13 -DCMAKE_CUDA_ARCHITECTURES=80'
            expected_payload: lib\ollama\cuda_v13\ggml-cuda.dll
            cuda-components:
              - '"cudart"'
              - '"nvcc"'
              - '"cublas"'
              - '"cublas_dev"'
              - '"crt"'
              - '"nvvm"'
              - '"nvptxcompiler"'
            cuda-version: '13.0'
          - preset: ROCm
            install: https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q1-Win11-For-HIP.exe
            rocm-version: '7.1'
            superbuild_target: ollama-llama-server-rocm_v7_1
            superbuild_dir: build\local-superbuild-rocm_v7_1
            superbuild_args: '-DOLLAMA_LLAMA_BACKENDS=rocm_v7_1 -DAMDGPU_TARGETS=gfx1010'
            expected_payload: lib\ollama\rocm_v7_1\ggml-hip.dll
          - preset: Vulkan
            install: https://sdk.lunarg.com/sdk/download/1.4.321.1/windows/vulkansdk-windows-X64-1.4.321.1.exe
            superbuild_target: ollama-llama-server-vulkan
            superbuild_dir: build\local-superbuild-vulkan
            superbuild_args: '-DOLLAMA_LLAMA_BACKENDS=vulkan'
            expected_payload: lib\ollama\vulkan\ggml-vulkan.dll
          - preset: 'MLX CUDA 13'
            install: https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_windows.exe
            cudnn-install: https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.18.1.3_cuda13-archive.zip
            superbuild_target: ollama-mlx-cuda_v13
            superbuild_dir: build\local-superbuild-mlx-cuda_v13
            superbuild_args: '-DOLLAMA_MLX_BACKENDS=cuda_v13 -DCMAKE_CUDA_ARCHITECTURES=80 -DMLX_CUDA_ARCHITECTURES=80-virtual'
            expected_payload: lib\ollama\mlx_cuda_v13\mlx.dll lib\ollama\mlx_cuda_v13\ollama_xgrammar.dll
            install-go: true
            cuda-components:
              - '"cudart"'
              - '"nvcc"'
              - '"cublas"'
              - '"cublas_dev"'
              - '"cufft"'
              - '"cufft_dev"'
              - '"nvrtc"'
              - '"nvrtc_dev"'
              - '"crt"'
              - '"nvvm"'
              - '"nvptxcompiler"'
            cuda-version: '13.0'
    runs-on: windows
    steps:
      - run: |
          choco install -y --no-progress ccache ninja
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache -o cache_dir=${{ github.workspace }}\.ccache
          }
      - if: matrix.preset == 'CUDA' || matrix.preset == 'ROCm' || matrix.preset == 'Vulkan' || matrix.preset == 'MLX CUDA 13'
        id: cache-install
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
            C:\Program Files\AMD\ROCm
            C:\VulkanSDK
            C:\Program Files\NVIDIA\CUDNN
          key: ${{ matrix.install }}-${{ matrix.cudnn-install }}
      - if: matrix.preset == 'CUDA' || matrix.preset == 'MLX CUDA 13'
        name: Install CUDA ${{ matrix.cuda-version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ steps.cache-install.outputs.cache-hit }}" -ne 'true') {
            Invoke-WebRequest -Uri "${{ matrix.install }}" -OutFile "install.exe"
            $subpackages = @(${{ join(matrix.cuda-components, ', ') }}) | Foreach-Object {"${_}_${{ matrix.cuda-version }}"}
            Start-Process -FilePath .\install.exe -ArgumentList (@("-s") + $subpackages) -NoNewWindow -Wait
          }

          $cudaPath = (Resolve-Path "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\*").path
          echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: matrix.preset == 'ROCm'
        name: Install ROCm ${{ matrix.rocm-version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ steps.cache-install.outputs.cache-hit }}" -ne 'true') {
            Invoke-WebRequest -Uri "${{ matrix.install }}" -OutFile "install.exe"
            Start-Process -FilePath .\install.exe -ArgumentList '-install' -NoNewWindow -Wait
          }

          $hipPath = (Resolve-Path "C:\Program Files\AMD\ROCm\*").path
          echo "$hipPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=$hipPath\bin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CXX=$hipPath\bin\clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "HIPCXX=$hipPath\bin\clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "HIP_PLATFORM=amd" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_PREFIX_PATH=$hipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - if: matrix.preset == 'Vulkan'
        name: Install Vulkan ${{ matrix.rocm-version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ steps.cache-install.outputs.cache-hit }}" -ne 'true') {
            Invoke-WebRequest -Uri "${{ matrix.install }}" -OutFile "install.exe"
            Start-Process -FilePath .\install.exe -ArgumentList "-c","--am","--al","in" -NoNewWindow -Wait
          }

          $vulkanPath = (Resolve-Path "C:\VulkanSDK\*").path
          $vulkanRuntime = Join-Path $vulkanPath "Helpers\VulkanRT.exe"
          if (Test-Path $vulkanRuntime) {
            Start-Process -FilePath $vulkanRuntime -ArgumentList "/s" -NoNewWindow -Wait
          }
          echo "$vulkanPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
      - if: matrix.preset == 'MLX CUDA 13'
        name: Install cuDNN for MLX
        run: |
          $ErrorActionPreference = "Stop"
          $cudnnRoot = "C:\Program Files\NVIDIA\CUDNN"
          if ("${{ steps.cache-install.outputs.cache-hit }}" -ne 'true') {
            Invoke-WebRequest -Uri "${{ matrix.cudnn-install }}" -OutFile "cudnn.zip"
            Expand-Archive -Path cudnn.zip -DestinationPath cudnn-extracted
            $cudnnDir = (Get-ChildItem -Path cudnn-extracted -Directory)[0].FullName
            New-Item -ItemType Directory -Force -Path $cudnnRoot
            Copy-Item -Path "$cudnnDir\*" -Destination "$cudnnRoot\" -Recurse
          }

          echo "CUDNN_ROOT_DIR=$cudnnRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDNN_INCLUDE_PATH=$cudnnRoot\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDNN_LIBRARY_PATH=$cudnnRoot\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$cudnnRoot\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: ${{ !cancelled() && steps.cache-install.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
            C:\Program Files\AMD\ROCm
            C:\VulkanSDK
            C:\Program Files\NVIDIA\CUDNN
          key: ${{ matrix.install }}-${{ matrix.cudnn-install }}
      - uses: actions/checkout@v4
      - if: matrix.superbuild_target == 'ollama-local' || matrix.install-go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ needs.changes.outputs.enginehash }}
      - name: Build native superbuild
        if: matrix.superbuild_target
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Enter-VsDevShell -VsInstallPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' -SkipAutomaticLocation  -DevCmdArguments '-arch=x64 -no_logo'
          cmake -S . -B "${{ matrix.superbuild_dir }}" ${{ matrix.superbuild_args }}
          $env:CMAKE_BUILD_PARALLEL_LEVEL = [Environment]::ProcessorCount
          cmake --build "${{ matrix.superbuild_dir }}" --target "${{ matrix.superbuild_target }}" -- -l $([Environment]::ProcessorCount)
          foreach ($f in "${{ matrix.expected_payload }}".Split(' ')) {
            if (!(Test-Path "${{ matrix.superbuild_dir }}\$f")) {
              throw "missing $f"
            }
          }
        env:
          CMAKE_GENERATOR: Ninja
      - name: Verify local superbuild install
        if: matrix.superbuild_target == 'ollama-local'
        run: |
          $ErrorActionPreference = "Stop"
          & ".\ollama.exe" --version
          & "${{ matrix.superbuild_dir }}\lib\ollama\llama-server.exe" --version
          if (!(Test-Path "${{ matrix.superbuild_dir }}\lib\ollama\llama-quantize.exe")) {
            throw "missing llama-quantize.exe"
          }
          $installPrefix = Join-Path $env:RUNNER_TEMP "ollama-local"
          cmake --install "${{ matrix.superbuild_dir }}" --component ollama-local --prefix "$installPrefix"
          & "$installPrefix\bin\ollama.exe" --version
          & "$installPrefix\lib\ollama\llama-server.exe" --version
          if (!(Test-Path "$installPrefix\lib\ollama\llama-quantize.exe")) {
            throw "missing installed llama-quantize.exe"
          }
  go_mod_tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check that 'go mod tidy' is clean
        run: go mod tidy --diff || (echo "Please run 'go mod tidy'." && exit 1)

  test:
    needs: [changes]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install UI dependencies
        working-directory: ./app/ui/app
        run: npm ci
      - name: Install tscriptify
        run: |
          go install github.com/tkrajina/typescriptify-golang-structs/tscriptify@latest
      - name: Run UI tests
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        working-directory: ./app/ui/app
        run: npm test
      - name: Verify MLX generated files are current
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          cmake -S . -B build/mlx-generate -DOLLAMA_MLX_BACKENDS=cuda_v13
          cmake --build build/mlx-generate --target ollama-mlx-generate-wrappers
          git diff --exit-code -- \
            x/imagegen/mlx/mlx.h \
            x/imagegen/mlx/mlx.c \
            x/mlxrunner/mlx/generated.h \
            x/mlxrunner/mlx/generated.c \
            x/mlxrunner/mlx/include/mlx/c
      - name: Run go generate
        run: go generate ./...

      - name: go test
        if: always()
        run: go test -count=1 -benchtime=1x ./...

      - name: go test app with live updater tag
        if: ${{ needs.changes.outputs.app_changed == 'True' && contains(fromJSON('["macos-latest","windows-latest"]'), matrix.os) }}
        run: go test -count=1 -tags updater_live ./app/...

      - uses: golangci/golangci-lint-action@v9
